[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdb-kafka-bridge"
version = "0.1.0"
description = "FoundationDB native CDC to Kafka bridge (UNT capstone)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6,<3",
    # Keep the minor in step with FDB_VERSION in the Dockerfile.
    "foundationdb>=8.0.0,<8.1",
    "protobuf>=7.34,<8",
]

[tool.setuptools]
packages = [
    "fdb_kafka_bridge",
    "fdb_kafka_bridge.bridge",
    "fdb_kafka_bridge.cdc",
    "fdb_kafka_bridge.kafka",
    "fdb_kafka_bridge.serialization",
    "fdbkafka",
    "fdbkafka.cdc",
    "fdbkafka.cdc.v1",
]

[tool.setuptools.package-dir]
fdb_kafka_bridge = "src/fdb_kafka_bridge"
fdbkafka = "protobuf/gen/fdbkafka"

[tool.setuptools.package-data]
"*" = ["*.pyi"]

[tool.black]
line-length = 88
target-version = ["py312"]
# Generated protobuf code (buf generate → protobuf/gen) is never hand-formatted.
force-exclude = "^/protobuf/gen/"

[tool.ruff]
line-length = 88
target-version = "py312"
src = [".", "src", "tests", "protobuf/gen"]
extend-exclude = ["protobuf/gen"]
# Honour excludes even when pre-commit passes files explicitly.
force-exclude = true

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "N",       # pep8-naming
  "UP",      # pyupgrade
  "B",       # flake8-bugbear
  "ANN",     # type hints required
  "D",       # docstrings
]
# FDB bindings are untyped; allow Any where no better type exists.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"protobuf/tests/**" = ["D"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "protobuf/tests"]
pythonpath = [".", "src", "protobuf/gen"]
markers = [
  "slow: builds a ~10 MB version group; deselect with -m 'not slow'",
  "integration: runs against a live local cluster or broker",
  "packaging: builds the wheel and installs it into a fresh venv (needs network)",
]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  # Manual smoke script: imports fdb and needs a live cluster.
  "--ignore=tests/test_cdc_e2e.py",
]
