name: CI

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all commits are signed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          FAILED=0
          for SHA in $(git rev-list "$BASE".."$HEAD"); do
            VERIFIED=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.verification.verified')
            SHORT=$(echo "$SHA" | cut -c1-7)
            if [ "$VERIFIED" != "true" ]; then
              echo "::error::Commit $SHORT is NOT verified"
              FAILED=1
            else
              echo "✓ $SHORT verified"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "All commits are signed and verified ✓"

  container-setup:
    needs: signed-commits
    uses: ./.github/workflows/Container-setup.yml

  lint:
    needs: container-setup
    uses: ./.github/workflows/lint.yml

  buf:
    needs: lint
    uses: ./.github/workflows/buf-ci.yaml

  protobuf-tests:
    needs: buf
    uses: ./.github/workflows/testing-protobuf.yaml
