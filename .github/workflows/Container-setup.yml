name: Container Setup

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FDB+CDC Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: fdb-cdc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify FDB cluster, CDC bindings, and read/write
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fdb-cdc:ci bash -c '
              set -e
              echo "=== Checking binaries ==="
              which fdbserver && which fdbcli

              echo "=== Checking libfdb_c ==="
              ls -la /usr/local/lib/libfdb_c.so

              echo "=== Testing Python CDC bindings ==="
              python3 -c "import fdb; fdb.api_version(800); print(\"FDB CDC bindings OK\")"

              echo "=== Waiting for FDB cluster to report available ==="
              AVAILABLE=0
              for i in $(seq 1 30); do
                if fdbcli --exec "status minimal" 2>&1 | grep -q "The database is available"; then
                  echo "FDB cluster is available!"
                  AVAILABLE=1
                  break
                fi
                echo "Waiting for FDB cluster ($i/30)..."
                sleep 1
              done
              if [ "$AVAILABLE" -ne 1 ]; then
                echo "::error::FDB cluster failed to become available within 30 seconds"
                fdbcli --exec "status"
                exit 1
              fi

              echo "=== Verifying FDB read/write ==="
              python3 /workspace/scripts/verify_fdb_cluster.py

              echo "=== Container setup verified ==="
            '

      - name: Run Protobuf tests inside FDB container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fdb-cdc:ci \
            bash -c '
              set -e
              pip3 install --break-system-packages "protobuf>=5.29.3,<8" pytest

              echo "=== Running Protobuf Test Suite ==="
              PYTHONPATH=/workspace/protobuf/gen python3 -m pytest protobuf/tests/ -v

              echo "=== All Protobuf Tests Passed ==="
            '

      - name: Run Serialization tests inside FDB container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HYPOTHESIS_PROFILE=ci \
            fdb-cdc:ci \
            bash -c '
              set -e
              pip3 install --break-system-packages -r requirements-dev.txt

              echo "=== Running Serialization Test Suite ==="
              pytest tests/serialization/ -v

              echo "=== All Serialization Tests Passed ==="
            '
