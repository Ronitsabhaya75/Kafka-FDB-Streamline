name: Container Setup

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FDB+CDC Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: fdb-cdc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify FDB cluster, CDC bindings, and read/write
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fdb-cdc:ci bash -c '
              set -e
              echo "=== Checking binaries ==="
              which fdbserver && which fdbcli

              echo "=== Checking libfdb_c ==="
              ls -la /usr/local/lib/libfdb_c.so

              echo "=== Testing Python CDC bindings ==="
              python3 -c "import fdb; fdb.api_version(800); print(\"FDB CDC bindings OK\")"

              echo "=== Waiting for FDB cluster to report available ==="
              AVAILABLE=0
              for i in $(seq 1 30); do
                if fdbcli --exec "status minimal" 2>&1 | grep -q "The database is available"; then
                  echo "FDB cluster is available!"
                  AVAILABLE=1
                  break
                fi
                echo "Waiting for FDB cluster ($i/30)..."
                sleep 1
              done
              if [ "$AVAILABLE" -ne 1 ]; then
                echo "::error::FDB cluster failed to become available within 30 seconds"
                fdbcli --exec "status"
                exit 1
              fi

              echo "=== Verifying FDB read/write ==="
              python3 /workspace/scripts/verify_fdb_cluster.py

              echo "=== Container setup verified ==="
            '

      - name: Save Docker image
        run: |
          docker save fdb-cdc:ci | gzip -1 > fdb-cdc-ci.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdb-cdc-ci-image
          path: fdb-cdc-ci.tar.gz
          retention-days: 1

  test-protobuf:
    needs: build-and-verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: fdb-cdc-ci-image

      - name: Load Docker image
        run: |
          gunzip -c fdb-cdc-ci.tar.gz | docker load

      - name: Run Protobuf tests inside FDB container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HYPOTHESIS_PROFILE=ci \
            fdb-cdc:ci \
            bash -c '
              set -e
              pip3 install --break-system-packages -r requirements-dev.txt

              echo "=== Running Protobuf Unit and Simulation Tests ==="
              PYTHONPATH=/workspace:/workspace/protobuf/gen \
              python3 -m pytest \
                protobuf/tests/test_mutations_proto.py \
                protobuf/tests/test_pipeline_simulation.py \
                -v
            '

  test-serialization:
    needs: build-and-verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: fdb-cdc-ci-image

      - name: Load Docker image
        run: |
          gunzip -c fdb-cdc-ci.tar.gz | docker load

      - name: Run Serialization tests inside FDB container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HYPOTHESIS_PROFILE=ci \
            fdb-cdc:ci \
            bash -c '
              set -e
              pip3 install --break-system-packages -r requirements-dev.txt

              echo "=== Running Serialization Tests with Coverage ==="
              PYTHONPATH=/workspace:/workspace/protobuf/gen \
              python3 -m pytest \
                --cov=src/serialization \
                --cov-report=term-missing \
                tests/serialization/ \
                -v
            '

  test-cdc-mutations:
    needs: build-and-verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: fdb-cdc-ci-image

      - name: Load Docker image
        run: |
          gunzip -c fdb-cdc-ci.tar.gz | docker load

      - name: Run CDC Mutations tests inside FDB container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HYPOTHESIS_PROFILE=ci \
            -e FDB_CDC_INTEGRATION=1 \
            fdb-cdc:ci \
            bash -c '
              set -e
              pip3 install --break-system-packages -r requirements-dev.txt

              echo "=== Running CDC Mutation Tests with Coverage ==="
              PYTHONPATH=/workspace:/workspace/protobuf/gen \
              python3 -m pytest \
                --cov=src/cdc \
                --cov-report=term-missing \
                tests/cdc/ \
                -v
            '
