name: Container Setup

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-containers:
    name: container (${{ matrix.distro.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: ubuntu-24.04
            base: ubuntu:24.04
          - name: rhel-9
            base: redhat/ubi9:latest
          - name: centos-stream-9
            base: quay.io/centos/centos:stream9

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FDB+CDC Docker image (${{ matrix.distro.name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.distro.base }}
          load: true
          tags: fdb-cdc:${{ matrix.distro.name }}
          cache-from: type=gha,scope=${{ matrix.distro.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro.name }}

      - name: Verify FDB cluster, CDC bindings, and read/write (${{ matrix.distro.name }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fdb-cdc:${{ matrix.distro.name }} bash -c '
              set -e
              echo "=== Checking binaries ==="
              which fdbserver && which fdbcli

              echo "=== Checking libfdb_c ==="
              ls -la /usr/local/lib/libfdb_c.so

              echo "=== Testing Python CDC bindings ==="
              python3 -c "import fdb; fdb.api_version(800); print(\"FDB CDC bindings OK\")"

              echo "=== Waiting for FDB cluster to report available ==="
              AVAILABLE=0
              for i in $(seq 1 30); do
                if fdbcli --exec "status minimal" 2>&1 | grep -q "The database is available"; then
                  echo "FDB cluster is available!"
                  AVAILABLE=1
                  break
                fi
                echo "Waiting for FDB cluster ($i/30)..."
                sleep 1
              done
              if [ "$AVAILABLE" -ne 1 ]; then
                echo "::error::FDB cluster failed to become available within 30 seconds"
                fdbcli --exec "status"
                exit 1
              fi

              echo "=== Verifying FDB read/write ==="
              python3 /workspace/scripts/verify_fdb_cluster.py

              echo "=== Container setup verified on ${{ matrix.distro.name }} ==="
            '

      - name: Run Protobuf tests inside container (${{ matrix.distro.name }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HYPOTHESIS_PROFILE=ci \
            fdb-cdc:${{ matrix.distro.name }} \
            bash -c '
              set -e
              pip3 install --break-system-packages -r requirements-dev.txt

              echo "=== Running Protobuf Unit and Simulation Tests ==="
              PYTHONPATH=/workspace:/workspace/protobuf/gen \
              python3 -m pytest \
                protobuf/tests/test_mutations_proto.py \
                protobuf/tests/test_pipeline_simulation.py \
                -v
            '

      - name: Run Serialization tests inside container (${{ matrix.distro.name }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HYPOTHESIS_PROFILE=ci \
            fdb-cdc:${{ matrix.distro.name }} \
            bash -c '
              set -e
              pip3 install --break-system-packages -r requirements-dev.txt

              echo "=== Running Serialization Tests with Coverage ==="
              PYTHONPATH=/workspace:/workspace/protobuf/gen \
              python3 -m pytest \
                --cov=src/serialization \
                --cov-report=term-missing \
                tests/serialization/ \
                -v
            '

      - name: Run CDC Mutation tests inside container (${{ matrix.distro.name }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HYPOTHESIS_PROFILE=ci \
            -e FDB_CDC_INTEGRATION=1 \
            fdb-cdc:${{ matrix.distro.name }} \
            bash -c '
              set -e
              pip3 install --break-system-packages -r requirements-dev.txt

              echo "=== Running CDC Mutation Tests with Coverage ==="
              PYTHONPATH=/workspace:/workspace/protobuf/gen \
              python3 -m pytest \
                --cov=src/cdc \
                --cov-report=term-missing \
                tests/cdc/ \
                -v
            '

  test-native-clients:
    name: test-native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run client unit tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest -m "not integration" -v
