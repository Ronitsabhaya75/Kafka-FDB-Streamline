name: Packaging

# Wheel acceptance test. It skips itself without PACKAGING_INTEGRATION=1 and pytest
# exits 0 when everything skips, so a separate step fails the job on any skip.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Wheel acceptance test
        env:
          PACKAGING_INTEGRATION: "1"
        run: pytest tests/test_packaging.py --junitxml="$RUNNER_TEMP/packaging.xml"

      - name: Fail if any test was skipped or none ran
        run: python scripts/require_no_skips.py "$RUNNER_TEMP/packaging.xml"
