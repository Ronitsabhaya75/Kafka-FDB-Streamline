name: Protobuf Tests
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protobuf-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FDB+CDC Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: fdb-cdc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Protobuf tests inside FDB container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fdb-cdc:ci \
            bash -c '
              set -e
              pip3 install --break-system-packages "protobuf>=7.36.1" pytest

              echo "=== Running Protobuf Test Suite ==="
              PYTHONPATH=/workspace/protobuf/gen python3 -m pytest protobuf/tests/ -v

              echo "=== All Protobuf Tests Passed ==="
            '
