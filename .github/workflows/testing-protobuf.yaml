name: Protobuf Unit Tests
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protobuf-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "protobuf>=7.36.1" pytest

      - name: Run all tests
        run: |
          PYTHONPATH=protobuf/gen python3 -m pytest protobuf/tests/ -v
