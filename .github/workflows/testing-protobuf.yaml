name: Protobuf Unit Tests
on:
  push:
    branches: ['main']

  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  protobuf-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "protobuf>=7.36.1" pytest

      - name: Run unit tests
        run: |
          PYTHONPATH=src/gen python3 -m pytest tests/proto_buf_tests/unit-test/ -v
