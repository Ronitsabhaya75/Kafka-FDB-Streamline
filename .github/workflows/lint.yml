name: Lint

# Check-only: ruff + black at the versions pinned in requirements-dev.txt.
# Never edits files or pushes commits.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check --output-format=github .

      - name: black
        if: success() || failure()
        run: black --check --diff .
