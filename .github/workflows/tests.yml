name: Tests

# pytest over tests/ and protobuf/tests/ at the versions pinned in
# requirements-dev.txt. Needs no FDB, Kafka or Docker.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest
        env:
          HYPOTHESIS_PROFILE: ci
